            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403OperationForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422OperationNotPossible'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      security:
      - apiKeyAuth: []
  /api/v1/vehicles/{vin}/charging-profiles/{id}:
    put:
      tags:
      - Charging
      summary: Updates a charging profile of a given vehicle.
      description: The vehicle applies the submitted profile as a whole, so send the complete
        profile - e.g. as returned by `GET /api/v1/vehicles/{vin}?include=chargingProfiles` - with
        the desired fields changed. A `404` is returned when either the vehicle or its charging
        profile with the given id is unknown.
      operationId: updateChargingProfile
      parameters:
      - $ref: '#/components/parameters/VinPathParameter'
      - $ref: '#/components/parameters/ChargingProfileIdPathParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingProfile'
        required: true
      responses:
        '202':
          description: Request to update the charging profile was performed.
          headers:
            X-API-Key-Expires-At:
              $ref: '#/components/headers/ApiKeyExpiresAt'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
