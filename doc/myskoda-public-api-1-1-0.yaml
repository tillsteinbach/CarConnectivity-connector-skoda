openapi: 3.0.3
info:
  title: MyŠkoda Public API
  description: |
    Public API for reading connected-vehicle data and remotely controlling Škoda vehicles. It
    enables third-party integrations, for example with smart-home platforms such as Home Assistant.

    Changes between released versions are listed in the
    [changelog](https://public.api.connect.skoda-auto.cz/docs/changelog).
  version: 1.1.0
servers:
- url: https://public.api.connect.skoda-auto.cz
tags:
- name: Vehicles
  description: Vehicle data API
- name: Charging
  description: Vehicle charging API
- name: AirConditioning
  description: Vehicle air conditioning API
paths:
  /api/v1/vehicles/{vin}:
    get:
      tags:
      - Vehicles
      summary: Returns the vehicle and its current state.
      description: 'The endpoint delivers the vehicle together with its current state: status (doors,
        windows, lights), fuel status, odometer, air conditioning (including auxiliary heating
        and active ventilation), charging, charging profiles (saved charging locations), parking
        position and the remote operations the vehicle supports.
        The response can be limited to selected parts of the data using the `include` query
        parameter.'
      operationId: getVehicle
      parameters:
      - $ref: '#/components/parameters/VinPathParameter'
      - name: include
        in: query
        description: |
          Limits the response to the selected parts of the vehicle data, as a comma-separated list.
          Each value corresponds to the part of the response with the same name, except `info`
          which covers the basic vehicle information (`name`, `licensePlate` and `renderUrl`).
          The `vin` is always returned, regardless of this parameter.

          When the parameter is omitted, all parts supported by the vehicle are returned. Parts the
          vehicle does not support are simply absent in that case - `*_UNSUPPORTED` errors are only
          reported for parts explicitly requested via this parameter. Unknown values are rejected
          with a `400 Bad Request` response.

          A part that is not included is absent from the response. Note that an included part may
          also be absent when its data could not be retrieved - in that case the response contains
          a corresponding error in the `errors` list.
        required: false
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePart'
        example:
        - status
        - charging
      responses:
        '200':
          description: The vehicle and its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
          headers:
            X-API-Key-Expires-At:
              $ref: '#/components/headers/ApiKeyExpiresAt'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      security:
      - apiKeyAuth: []
  /api/v1/vehicles/{vin}/charging/start:
    post:
      tags:
      - Charging
      summary: Start charging for a given vehicle.
      operationId: startCharging
      parameters:
      - $ref: '#/components/parameters/VinPathParameter'
      responses:
        '202':
          description: Request to start charging was performed.
          headers:
            X-API-Key-Expires-At:
              $ref: '#/components/headers/ApiKeyExpiresAt'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403OperationForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422OperationNotPossible'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      security:
      - apiKeyAuth: []
  /api/v1/vehicles/{vin}/charging/stop:
    post:
      tags:
      - Charging
      summary: Stop charging for a given vehicle.
      operationId: stopCharging
      parameters:
      - $ref: '#/components/parameters/VinPathParameter'
      responses:
        '202':
          description: Request to stop charging was performed.
          headers:
            X-API-Key-Expires-At:
