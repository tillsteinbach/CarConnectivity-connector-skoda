            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403OperationForbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422OperationNotPossible'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      security:
      - apiKeyAuth: []
  /api/v1/vehicles/{vin}/charging/limit:
    put:
      tags:
      - Charging
      summary: Sets the charging limit for a given vehicle.
      operationId: setChargingLimit
      parameters:
      - $ref: '#/components/parameters/VinPathParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingLimit'
        required: true
      responses:
        '202':
          description: Request to set the charging limit was performed.
          headers:
            X-API-Key-Expires-At:
              $ref: '#/components/headers/ApiKeyExpiresAt'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Limit:
